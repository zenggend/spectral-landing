<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPECTRAL — сайт как запуск</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09080c;--bg2:#0e0c12;--bg3:#131019;
  --ink:#ede8e3;--ink-soft:#b0a9a2;--muted:#5e5b58;
  --line:rgba(237,232,227,.08);--line-mid:rgba(237,232,227,.14);
  --surface:rgba(16,13,22,.84);--glass:rgba(16,13,22,.6);
  --acc:#a8c5da;--acc-dim:rgba(168,197,218,.12);--acc-glow:rgba(168,197,218,.22);
  --hi:#c9b8f5;
  --radius:20px;--ease:cubic-bezier(.22,1,.36,1);--ease-in:cubic-bezier(.76,0,.24,1);
}
html[data-theme="light"]{
  --bg:#f4f2ef;--bg2:#ede9e4;--bg3:#e6e1da;
  --ink:#100e14;--ink-soft:#3e3b38;--muted:#8a8480;
  --line:rgba(16,14,20,.07);--line-mid:rgba(16,14,20,.12);
  --surface:rgba(255,252,248,.8);--glass:rgba(244,242,239,.7);
  --acc:#607da0;--acc-dim:rgba(96,125,160,.1);--acc-glow:rgba(96,125,160,.2);--hi:#7b5ea7;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);cursor:none;
  font-family:'Helvetica Neue',Helvetica,'Segoe UI',Arial,sans-serif;-webkit-font-smoothing:antialiased}

/* ── CURSOR ── */
#cur{position:fixed;z-index:9999;width:10px;height:10px;border-radius:50%;background:#ffffff;
  pointer-events:none;transform:translate(-50%,-50%);
  transition:width .2s var(--ease),height .2s var(--ease),background .3s;will-change:left,top;
  box-shadow:0 0 10px rgba(255,255,255,.6)}
#cur-ring{position:fixed;z-index:9998;width:34px;height:34px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.4);pointer-events:none;transform:translate(-50%,-50%);
  will-change:left,top;transition:width .25s,height .25s,border-color .3s}
html[data-theme="light"] #cur{background:#100e14;box-shadow:0 0 8px rgba(0,0,0,.25)}
html[data-theme="light"] #cur-ring{border-color:rgba(16,14,20,.3)}
body:has(button:hover) #cur,body:has(a:hover) #cur{width:22px;height:22px;background:var(--acc);box-shadow:0 0 14px var(--acc-glow)}
body:has(button:hover) #cur-ring,body:has(a:hover) #cur-ring{width:50px;height:50px;border-color:var(--acc)}

#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ── WIPE ── */
#wipe{position:fixed;inset:0;z-index:500;pointer-events:none;display:flex;flex-direction:column}
.ws{flex:1;background:var(--bg3);transform:scaleX(0);transform-origin:left center}

/* ── GRAIN ── */
#grain{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:.018;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='f'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23f)'/%3E%3C/svg%3E");
  background-size:180px}

/* ── HEADER ── */
header{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;
  justify-content:space-between;padding:24px 48px;
  background:linear-gradient(to bottom,var(--bg) 0%,transparent 100%)}
.brand{background:none;border:none;cursor:none;color:var(--ink);font-size:12px;font-weight:700;
  letter-spacing:.28em;display:flex;align-items:center;gap:12px;opacity:.92}
.brand:hover{opacity:1}
.brand-mark{width:30px;height:30px;flex-shrink:0}
.nav-rail{display:flex;gap:2px;background:var(--surface);backdrop-filter:blur(24px) saturate(1.2);
  border:1px solid var(--line-mid);border-radius:100px;padding:4px 5px}
.nav-rail button{background:none;border:none;cursor:none;color:var(--muted);font-size:11px;
  font-weight:600;letter-spacing:.1em;padding:7px 18px;border-radius:100px;
  transition:color .2s,background .2s;white-space:nowrap}
.nav-rail button.on{background:rgba(237,232,227,.09);color:var(--ink)}
.hdr-tools{display:flex;gap:8px}
.hdr-tools button{background:var(--surface);backdrop-filter:blur(20px);border:1px solid var(--line-mid);
  border-radius:100px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.09em;
  padding:8px 18px;cursor:none;transition:color .2s,border-color .2s}
.hdr-tools button:hover{color:var(--ink)}

/* ── SCENES ── */
.scene{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:108px 64px 80px;opacity:0;pointer-events:none}
.scene.active{opacity:1;pointer-events:all}

.e{opacity:0;transform:translateY(28px);transition:opacity .65s var(--ease),transform .65s var(--ease)}
.scene.active .e{opacity:1;transform:translateY(0)}
.scene.active .e:nth-child(2){transition-delay:.09s}
.scene.active .e:nth-child(3){transition-delay:.18s}
.scene.active .e:nth-child(4){transition-delay:.27s}
.scene.active .e:nth-child(5){transition-delay:.36s}
.scene.active .e:nth-child(6){transition-delay:.45s}
.scene.active .e:nth-child(7){transition-delay:.54s}
.scene.active .e:nth-child(8){transition-delay:.63s}

/* ── TYPO ── */
.kicker{display:inline-flex;align-items:center;gap:10px;font-size:10.5px;font-weight:700;
  letter-spacing:.22em;color:var(--muted);text-transform:uppercase;margin-bottom:22px}
.kicker::before{content:'';width:22px;height:1px;background:var(--acc);opacity:.7}
.hi{color:var(--acc)}.hi2{color:var(--hi)}
.caret{display:inline-block;width:2px;height:.9em;background:var(--acc);vertical-align:middle;
  margin-left:3px;animation:blink .85s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ── CHROME UI ── */
#prog-bar{position:fixed;bottom:0;left:0;z-index:300;height:1.5px;background:var(--acc);
  transition:width .7s var(--ease);opacity:.7}
#ctr{position:fixed;bottom:36px;left:48px;z-index:300;font-size:10.5px;letter-spacing:.18em;
  color:var(--muted);font-weight:600}
.arrows{position:fixed;bottom:28px;right:48px;z-index:300;display:flex;gap:8px}
.arrows button{width:42px;height:42px;border-radius:50%;background:var(--surface);
  backdrop-filter:blur(16px);border:1px solid var(--line-mid);color:var(--ink);cursor:none;
  display:flex;align-items:center;justify-content:center;transition:border-color .2s,transform .2s}
.arrows button:hover{transform:scale(1.07)}
.arrows button:disabled{opacity:.22;pointer-events:none}

/* ═══ S0: INTRO ═══ */
#s0{flex-direction:column;text-align:center}
.intro-phase{transition:opacity .55s var(--ease),transform .55s var(--ease)}
.intro-phase.fade-out{opacity:0;transform:translateY(-18px);pointer-events:none}
.t-hello{font-size:clamp(52px,8vw,104px);font-weight:800;line-height:1;letter-spacing:-.04em;min-height:1.05em}
.t-welcome{font-size:clamp(15px,2vw,20px);color:var(--ink-soft);font-weight:400;margin-top:14px;min-height:1.6em}
.t-question{font-size:clamp(18px,2.5vw,28px);color:var(--ink-soft);font-weight:400;margin-bottom:32px;min-height:1.5em}
.name-row{display:flex;background:var(--surface);backdrop-filter:blur(28px) saturate(1.2);
  border:1px solid var(--line-mid);border-radius:100px;overflow:hidden;max-width:440px;margin:0 auto;
  transition:border-color .3s}
.name-row:focus-within{border-color:var(--acc)}
.name-row.err{border-color:rgba(237,100,90,.6);animation:shake .35s}
.name-row input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:16px;
  font-family:inherit;padding:17px 24px}
.name-row input::placeholder{color:var(--muted)}
.name-row button{background:var(--acc);border:none;cursor:none;color:var(--bg);font-size:12px;
  font-weight:700;letter-spacing:.1em;padding:0 30px;transition:opacity .2s}
.name-row button:hover{opacity:.82}
.scroll-hint{position:absolute;bottom:86px;left:50%;transform:translateX(-50%);font-size:10px;
  letter-spacing:.2em;color:var(--muted);font-weight:600;opacity:0;transition:opacity .6s;
  display:flex;align-items:center;gap:9px;pointer-events:none}
.scroll-hint.on{opacity:1}
.scroll-hint::before,.scroll-hint::after{content:'';width:18px;height:1px;background:var(--muted);opacity:.5}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}60%{transform:translateX(7px)}80%{transform:translateX(-4px)}}

/* ═══ BRIDGE ═══ */
.bridge-sc{justify-content:flex-start;align-items:flex-end;padding-bottom:110px}
.bridge-inner{max-width:860px}
.bridge-pulse{width:7px;height:7px;border-radius:50%;background:var(--acc);margin-bottom:32px;
  box-shadow:0 0 0 0 var(--acc-glow);animation:orbpulse 2.2s ease-in-out infinite}
@keyframes orbpulse{0%{box-shadow:0 0 0 0 var(--acc-glow)}60%{box-shadow:0 0 0 14px rgba(168,197,218,0)}100%{box-shadow:0 0 0 0 rgba(168,197,218,0)}}
.bridge-line{font-size:clamp(28px,4.5vw,60px);font-weight:700;line-height:1.12;letter-spacing:-.03em;min-height:1.2em}
.bridge-dots{display:flex;gap:6px;margin-top:36px}
.bridge-dots span{width:4px;height:4px;border-radius:50%;background:var(--muted);opacity:.3;
  animation:dotpop .6s var(--ease) both}
.bridge-dots span:nth-child(2){animation-delay:.15s}
.bridge-dots span:nth-child(3){animation-delay:.3s}
@keyframes dotpop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:.3}}

/* ═══ S2: ABOUT ═══ */
#s2{align-items:stretch;gap:80px;max-width:1280px;margin:0 auto;width:100%}
.about-l{flex:1;display:flex;flex-direction:column;justify-content:center}
.about-r{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:center}
.big-h{font-size:clamp(38px,5.5vw,74px);font-weight:800;line-height:.98;letter-spacing:-.045em;margin-bottom:26px}
.body-p{font-size:clamp(14px,1.4vw,17px);color:var(--ink-soft);line-height:1.7;max-width:420px}
.p-card{background:var(--surface);backdrop-filter:blur(20px) saturate(1.1);border:1px solid var(--line);
  border-radius:var(--radius);padding:28px 24px;cursor:none;
  transition:border-color .3s var(--ease),transform .35s var(--ease);position:relative;overflow:hidden}
.p-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--acc),transparent);opacity:0;transition:opacity .3s}
.p-card:hover{border-color:var(--line-mid);transform:translateY(-5px)}
.p-card:hover::after{opacity:.6}
.p-num{font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--acc);margin-bottom:12px}
.p-title{font-size:15px;font-weight:700;margin-bottom:8px}
.p-text{font-size:12.5px;color:var(--ink-soft);line-height:1.65}

/* ═══ S4: PROCESS ═══ */
#s4{flex-direction:column;gap:52px;max-width:1100px;margin:0 auto;width:100%}
.proc-head{display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
.proc-h{font-size:clamp(34px,5vw,66px);font-weight:800;letter-spacing:-.045em;line-height:.98}
.proc-sub{font-size:14px;color:var(--ink-soft);line-height:1.7;max-width:320px}
.steps{display:grid;grid-template-columns:repeat(4,1fr)}
.step{border:1px solid var(--line);padding:36px 28px 32px;cursor:none;position:relative;overflow:hidden;
  transition:background .3s,border-color .3s;background:var(--surface)}
.step:not(:first-child){border-left:none}
.step:first-child{border-radius:var(--radius) 0 0 var(--radius)}
.step:last-child{border-radius:0 var(--radius) var(--radius) 0}
.step-line{position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--acc) var(--fill,0%),transparent var(--fill,0%));opacity:.5;transition:--fill .6s}
.step:hover{background:rgba(237,232,227,.03);border-color:var(--line-mid)}
.step:hover .step-line{--fill:100%}
.step-n{font-size:42px;font-weight:900;letter-spacing:-.05em;color:rgba(237,232,227,.06);line-height:1;margin-bottom:28px}
.step-t{font-size:16px;font-weight:700;margin-bottom:10px}
.step-b{font-size:12.5px;color:var(--ink-soft);line-height:1.65}
.step::before{content:'';position:absolute;top:50%;right:-1px;z-index:1;width:1px;height:32px;
  margin-top:-16px;background:var(--line-mid)}
.step:last-child::before{display:none}

/* ═══ S6: CASES ═══ */
#s6{flex-direction:column;gap:36px;max-width:1300px;margin:0 auto;width:100%}
.cases-h{display:flex;align-items:flex-end;justify-content:space-between}
.big-h2{font-size:clamp(28px,4vw,52px);font-weight:800;letter-spacing:-.04em;line-height:.98}
.cases-hint{font-size:12px;color:var(--muted);max-width:200px;line-height:1.6}
.cases-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.c-card{background:rgba(14,11,20,.92);backdrop-filter:blur(24px) saturate(1.1);border:1px solid rgba(237,232,227,.07);
  border-radius:var(--radius);padding:26px 22px 22px;cursor:none;display:flex;flex-direction:column;
  position:relative;overflow:hidden;transition:border-color .35s var(--ease),transform .4s var(--ease)}
.c-card:hover{border-color:rgba(168,197,218,.22);transform:translateY(-7px)}
.c-card.sel{border-color:rgba(168,197,218,.40);transform:translateY(-10px) scale(1.015)}
.c-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1.5px;
  background:linear-gradient(90deg,transparent,var(--acc),transparent);opacity:0;transition:opacity .3s}
.c-card.sel::before{opacity:1}
.c-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:auto}
.c-tag{font-size:9.5px;font-weight:700;letter-spacing:.12em;color:var(--muted);
  background:rgba(168,197,218,.07);border:1px solid rgba(168,197,218,.1);border-radius:100px;padding:4px 9px}
.c-pal{width:100%;height:72px;border-radius:10px;margin:18px 0 14px}
.c-name{font-size:16px;font-weight:700;margin-bottom:3px}
.c-dom{font-size:11px;color:var(--muted)}
.c-sum{font-size:12px;color:var(--ink-soft);line-height:1.65;margin-top:10px;max-height:0;overflow:hidden;
  transition:max-height .45s var(--ease)}
.c-card.sel .c-sum{max-height:110px}
.c-open{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
  letter-spacing:.07em;color:var(--acc);text-decoration:none;margin-top:12px;opacity:0;transition:opacity .3s .1s}
.c-card.sel .c-open{opacity:1}
.c-open:hover{opacity:.72}
.c-open svg{transition:transform .2s}
.c-open:hover svg{transform:translateX(4px)}

/* ═══ S8: FORM ═══ */
#s8{align-items:stretch;gap:80px;max-width:1080px;margin:0 auto;width:100%}
.form-l{flex:1;display:flex;flex-direction:column;justify-content:center}
.form-r{flex:0 0 420px;display:flex;flex-direction:column;justify-content:center}
.form-cta{font-size:clamp(32px,5vw,62px);font-weight:800;line-height:1.04;letter-spacing:-.04em;margin-bottom:22px}
.form-sub{font-size:14px;color:var(--ink-soft);line-height:1.7}
.c-form{background:var(--surface);backdrop-filter:blur(30px) saturate(1.2);border:1px solid var(--line-mid);
  border-radius:24px;padding:34px;opacity:0;transform:translateY(20px);
  transition:opacity .65s var(--ease),transform .65s var(--ease)}
.c-form.on{opacity:1;transform:translateY(0)}
.fg{margin-bottom:18px}
.fg label{display:block;font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--muted);
  margin-bottom:7px;text-transform:uppercase}
.fg input,.fg textarea{width:100%;background:rgba(237,232,227,.05);border:1px solid var(--line);
  border-radius:12px;color:var(--ink);font-size:14px;font-family:inherit;padding:13px 16px;
  outline:none;resize:none;transition:border-color .3s}
.fg input:focus,.fg textarea:focus{border-color:var(--acc)}
.fg input::placeholder,.fg textarea::placeholder{color:var(--muted)}
.sub-btn{width:100%;background:var(--acc);border:none;cursor:none;color:var(--bg);font-size:13px;
  font-weight:700;letter-spacing:.08em;padding:15px;border-radius:12px;margin-top:4px;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .2s,transform .2s}
.sub-btn:hover{opacity:.84;transform:translateY(-2px)}
.f-result{display:none;margin-top:18px;padding:18px;background:rgba(168,197,218,.07);
  border:1px solid rgba(168,197,218,.18);border-radius:12px;font-size:12.5px;line-height:1.65}
.f-result.on{display:block}
.f-result strong{color:var(--acc);display:block;margin-bottom:5px}

@media(max-width:960px){
  header{padding:16px 24px}
  .scene{padding:90px 24px 72px}
  #s2{flex-direction:column;gap:36px}
  .about-r{grid-template-columns:1fr 1fr}
  .steps{grid-template-columns:1fr 1fr}
  .step:first-child{border-radius:var(--radius) var(--radius) 0 0}
  .step:last-child{border-radius:0 0 var(--radius) var(--radius)}
  .step:nth-child(2){border-left:1px solid var(--line)}
  .step:nth-child(3){border-top:none}
  .step::before{display:none}
  .cases-row{grid-template-columns:1fr 1fr}
  #s8{flex-direction:column;gap:36px}
  .form-r{flex:none;width:100%}
  .proc-head{flex-direction:column;align-items:flex-start;gap:16px}
  .cases-h{flex-direction:column;align-items:flex-start;gap:12px}
}
</style>
</head>
<body>
<div id="cur"></div>
<div id="cur-ring"></div>
<canvas id="bg-canvas"></canvas>
<div id="grain"></div>
<div id="wipe">
  <div class="ws" id="ws0"></div><div class="ws" id="ws1"></div><div class="ws" id="ws2"></div>
  <div class="ws" id="ws3"></div><div class="ws" id="ws4"></div><div class="ws" id="ws5"></div>
</div>

<header>
  <button class="brand" onclick="nav(0)">
    <svg class="brand-mark" viewBox="0 0 30 30" fill="none">
      <rect x="4" y="4" width="8" height="22" rx="1.2" transform="rotate(8 4 4)" stroke="currentColor" stroke-width="1.5" opacity=".9"/>
      <line x1="16" y1="7"  x2="27" y2="5"  stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/>
      <line x1="17" y1="14" x2="27" y2="14" stroke="var(--acc)" stroke-width="2" stroke-linecap="round" opacity=".6"/>
      <line x1="16" y1="21" x2="27" y2="23" stroke="var(--acc)" stroke-width="2" stroke-linecap="round" opacity=".35"/>
    </svg>
    SPECTRAL
  </button>
  <nav class="nav-rail" id="nav-rail">
    <button onclick="nav(0)" class="on" data-nav="0" data-t="nav0"></button>
    <button onclick="nav(2)"             data-nav="1" data-t="nav1"></button>
    <button onclick="nav(4)"             data-nav="2" data-t="nav2"></button>
    <button onclick="nav(6)"             data-nav="3" data-t="nav3"></button>
    <button onclick="nav(8)"             data-nav="4" data-t="nav4"></button>
  </nav>
  <div class="hdr-tools">
    <button onclick="toggleTheme()" id="tbtn"></button>
    <button onclick="toggleLang()"  id="lbtn">EN</button>
  </div>
</header>

<div id="prog-bar" style="width:0"></div>
<div id="ctr">01 / 09</div>
<div class="arrows">
  <button id="b-prev" onclick="nav(cur-1)" disabled>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
  </button>
  <button id="b-next" onclick="nav(cur+1)">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
  </button>
</div>

<!-- S0 -->
<section class="scene active" id="s0">
  <div id="ph-greet" class="intro-phase" style="text-align:center;max-width:680px;margin:0 auto">
    <h1 class="t-hello" id="t-hello"><span class="caret"></span></h1>
    <p  class="t-welcome" id="t-welcome"></p>
  </div>
  <div id="ph-name" class="intro-phase" style="text-align:center;max-width:480px;margin:0 auto;position:absolute;opacity:0;pointer-events:none">
    <p  class="t-question" id="t-question"></p>
    <div class="name-row" id="name-row">
      <input id="name-in" maxlength="42" type="text" data-t-ph="placeholder">
      <button onclick="start()" id="start-btn" data-t="startBtn"></button>
    </div>
  </div>
  <div class="scroll-hint" id="scroll-hint" data-t="scrollHint"></div>
</section>

<!-- S1 BRIDGE -->
<section class="scene bridge-sc" id="s1">
  <div class="bridge-inner">

<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('bg-canvas');
const W = () => window.innerWidth, H = () => window.innerHeight;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W(), H());
renderer.setClearColor(0, 0);

const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(60, W()/H(), 0.1, 60);
cam.position.z = 5;
const clock = new THREE.Clock();

/* ── BACKGROUND GRID SHADER ── */
const bgMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: { uT:{value:0}, uMx:{value:.5}, uMy:{value:.5}, uDark:{value:1} },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `
    uniform float uT,uMx,uMy,uDark;
    varying vec2 vUv;
    float grid(vec2 uv,float sz){
      vec2 g=fract(uv/sz);
      float lx=smoothstep(0.,.018/sz,g.x)*smoothstep(1.,1.-.018/sz,g.x);
      float ly=smoothstep(0.,.018/sz,g.y)*smoothstep(1.,1.-.018/sz,g.y);
      return max(lx,ly);
    }
    void main(){
      vec2 uv=vUv;
      vec2 gUv=(uv-.5)*vec2(3.5,2.);
      float g=grid(gUv+uT*.012,.28)*.038+grid(gUv*3.+uT*.03,.28)*.012;
      float dx=uv.x-uMx, dy=uv.y-uMy;
      float glow=exp(-(dx*dx+dy*dy)*6.)*.06;
      float vig=(1.-smoothstep(.3,.7,abs(uv.x-.5)*2.))*(1.-smoothstep(.25,.75,abs(uv.y-.5)*2.));
      vec3 col=vec3(.52,.64,.76)*(g+glow);
      gl_FragColor=vec4(col,(g+glow+vig*.04)*uDark*.9);
    }
  `
});
const bgMesh = new THREE.Mesh(new THREE.PlaneGeometry(8,5), bgMat);
bgMesh.position.z = -1;
scene.add(bgMesh);

/* ── 3D SHAPES ── */
function mkSolid(geo, x, y, z){
  const mat = new THREE.MeshStandardMaterial({
    color:0x8aaec5, emissive:0x1a2e3d, emissiveIntensity:.5,
    roughness:.3, metalness:.6, transparent:true, opacity:.22
  });
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x,y,z);
  scene.add(m);
  return m;
}
function mkWire(geo, x, y, z){
  const mat = new THREE.MeshBasicMaterial({ color:0xa8c5da, wireframe:true, transparent:true, opacity:.12 });
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x,y,z);
  scene.add(m);
  return m;
}

const ico = mkSolid(new THREE.IcosahedronGeometry(.72,0),  2.4,  1.0, -1.5);
const oct = mkSolid(new THREE.OctahedronGeometry(.52,0),  -2.2, -0.7, -1.8);
const tet = mkSolid(new THREE.TetrahedronGeometry(.48,0), -1.0,  1.0, -1.2);
const tor = mkWire( new THREE.TorusGeometry(.58,.13,12,48), 0.4,  1.6, -2.0);

scene.add(new THREE.AmbientLight(0xffffff, .3));
const ptL = new THREE.PointLight(0xa8c5da, 1.8, 10);
ptL.position.set(2,2,2); scene.add(ptL);

/* ── BOKEH PARTICLES with CPU REPULSION ── */
const N = 380;
const pos     = new Float32Array(N * 3);
const origPos = new Float32Array(N * 3);
const vel     = new Float32Array(N * 3);
const psizes  = new Float32Array(N);
const pdepths = new Float32Array(N); // 0=close(blurry), 1=far(smaller)

for(let i = 0; i < N; i++){
  const x = (Math.random()-.5) * 11;
  const y = (Math.random()-.5) * 7;
  const z = -1 - Math.random() * 3.5;
  pos[i*3]=origPos[i*3]=x;
  pos[i*3+1]=origPos[i*3+1]=y;
  pos[i*3+2]=origPos[i*3+2]=z;
  psizes[i]  = 0.32 + Math.random() * 1.25;
  pdepths[i] = (-z - 1) / 3.5;
}

const pcolors = new Float32Array(N * 3);
for(let i = 0; i < N; i++){
  pcolors[i*3] = 1; pcolors[i*3+1] = 1; pcolors[i*3+2] = 1;
}

const ptGeo = new THREE.BufferGeometry();
ptGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
ptGeo.setAttribute('pSize',    new THREE.BufferAttribute(psizes, 1));
ptGeo.setAttribute('pDepth',   new THREE.BufferAttribute(pdepths, 1));
ptGeo.setAttribute('pColor',   new THREE.BufferAttribute(pcolors, 3));

const ptMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false,
  uniforms:{ uT:{value:0} },
  vertexShader:`
    attribute float pSize, pDepth;
    attribute vec3 pColor;
    uniform float uT;
    varying float vDepth;
    varying vec3 vColor;
    void main(){
      vDepth = pDepth;
      vColor = pColor;
      vec4 mv = modelViewMatrix * vec4(position, 1.);
      gl_PointSize = pSize * (360. / -mv.z);
      gl_Position  = projectionMatrix * mv;
    }
  `,
  fragmentShader:`
    varying float vDepth;
    varying vec3 vColor;
    void main(){
      vec2 d = gl_PointCoord - .5;
      float r = length(d);
      if(r > .5) discard;
      float softness = mix(4., 14., vDepth);
      float a = exp(-r*r * softness) * mix(.55, .28, vDepth);
      gl_FragColor = vec4(vColor, a);
    }
  `
});
scene.add(new THREE.Points(ptGeo, ptMat));

/* ── DRAG SHAPES ── */
const shapes = [ico, oct, tet, tor];
const raycaster = new THREE.Raycaster();
const ndcMouse  = new THREE.Vector2();
const dragPlane = new THREE.Plane();
const _ip       = new THREE.Vector3();
const _dragOff  = new THREE.Vector3();
let   dragObj   = null;

function toNDC(x, y){ ndcMouse.x=(x/W())*2-1; ndcMouse.y=-(y/H())*2+1; }
function getXY(e){ return e.touches&&e.touches.length?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY}; }

function onPointerDown(e){
  const {x,y}=getXY(e);
  toNDC(x,y);
  raycaster.setFromCamera(ndcMouse, cam);
  const hits = raycaster.intersectObjects(shapes);
  if(hits.length){
    dragObj = hits[0].object;
    const normal = new THREE.Vector3();
    cam.getWorldDirection(normal);
    dragPlane.setFromNormalAndCoplanarPoint(normal, dragObj.position);
    raycaster.ray.intersectPlane(dragPlane, _ip);
    _dragOff.copy(dragObj.position).sub(_ip);
    if(e.cancelable) e.preventDefault();
  }
}
function onPointerMove(e){
  if(!dragObj) return;
  const {x,y}=getXY(e);
  toNDC(x,y);
  raycaster.setFromCamera(ndcMouse, cam);
  if(raycaster.ray.intersectPlane(dragPlane, _ip)){
    dragObj.position.copy(_ip).add(_dragOff);
  }
  if(e.cancelable) e.preventDefault();
}
function onPointerUp(){ dragObj = null; }

window.addEventListener('mousedown',  onPointerDown, true);
window.addEventListener('mousemove',  onPointerMove, true);
window.addEventListener('mouseup',    onPointerUp,   true);
window.addEventListener('touchstart', onPointerDown, {passive:false, capture:true});
window.addEventListener('touchmove',  onPointerMove, {passive:false, capture:true});
window.addEventListener('touchend',   onPointerUp,   true);

/* ── MOUSE tracking ── */
let mx=.5, my=.5, rmx=.5, rmy=.5;
// world-space mouse (z=0 plane)
let mwx=0, mwy=0;

document.addEventListener('mousemove', e=>{
  mx = e.clientX/W();
  my = e.clientY/H();
  // project to world at z=0
  const fovY = cam.fov * Math.PI / 180;
  const halfH = Math.tan(fovY/2) * cam.position.z;
  mwx = (mx-.5) * 2 * halfH * cam.aspect;
  mwy = -(my-.5) * 2 * halfH;
  document.getElementById('cur').style.left = e.clientX+'px';
  document.getElementById('cur').style.top  = e.clientY+'px';
});
(function tickRing(){
  rmx += (mx-rmx)*.09; rmy += (my-rmy)*.09;
  const r = document.getElementById('cur-ring');
  r.style.left = rmx*W()+'px';
  r.style.top  = rmy*H()+'px';
  requestAnimationFrame(tickRing);
})();

/* ── LOOP ── */
function loop(){
  requestAnimationFrame(loop);
  const t = clock.getElapsedTime();

  bgMat.uniforms.uT.value  = t;
  bgMat.uniforms.uMx.value = mx;
  bgMat.uniforms.uMy.value = 1-my;

  // shapes — pause rotation while dragging
  if(dragObj !== ico){ ico.rotation.x=t*.17; ico.rotation.y=t*.23; }
  if(dragObj !== oct){ oct.rotation.x=t*.21; oct.rotation.z=t*.14; }
  if(dragObj !== tet){ tet.rotation.y=t*.25; tet.rotation.z=t*.18; }
  if(dragObj !== tor){ tor.rotation.x=t*.19; tor.rotation.y=t*.16; }
  // scale up dragged object slightly
  shapes.forEach(s => {
    const target = s===dragObj ? 1.18 : 1.0;
    s.scale.lerp(new THREE.Vector3(target,target,target), 0.12);
  });

  // CPU repulsion particles
  const posArr = ptGeo.attributes.position.array;
  const RRAD=2.2, REPEL=.09, SPRING=.028, DAMP=.80;
  for(let i=0;i<N;i++){
    const ix=i*3, iy=i*3+1;
    // ambient drift (slow, very subtle)
    const drift = Math.sin(t*.15+origPos[ix]*.5)*.004;
    vel[iy] += drift;

    const dx=posArr[ix]-mwx, dy=posArr[iy]-mwy;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<RRAD && dist>.001){
      const f=(1-dist/RRAD)*REPEL/dist;
      vel[ix]+=dx*f; vel[iy]+=dy*f;
    }
    // spring back
    vel[ix]+=(origPos[ix]-posArr[ix])*SPRING;
    vel[iy]+=(origPos[iy]-posArr[iy])*SPRING;
    // damping
    vel[ix]*=DAMP; vel[iy]*=DAMP;
    posArr[ix]+=vel[ix]; posArr[iy]+=vel[iy];
  }
  ptGeo.attributes.position.needsUpdate = true;

  // camera parallax
  cam.position.x += ((mx-.5)*.4 - cam.position.x)*.04;
  cam.position.y += (-(my-.5)*.3 - cam.position.y)*.04;
  cam.lookAt(0,0,0);

  renderer.render(scene, cam);
}
loop();

window.addEventListener('resize',()=>{
  cam.aspect=W()/H(); cam.updateProjectionMatrix(); renderer.setSize(W(),H());
});
window._setDark = d => { bgMat.uniforms.uDark.value = d?1:.5; };
</script>

/* ── Apply translations ── */
function applyLang(){
  var d = T[lang];
  // data-t (text content)
  document.querySelectorAll('[data-t]').forEach(function(el){
    var k = el.dataset.t;
    if(d[k] !== undefined) el.textContent = d[k];
  });
  // data-t-ph (placeholders)
  document.querySelectorAll('[data-t-ph]').forEach(function(el){
    var k = el.dataset.tPh;
    if(d[k] !== undefined) el.placeholder = d[k];
  });
  // innerHTML elements
  var map = { s2h:'s2h', s2p:'s2p', s4h:'s4h', s8h:'s8h', s6h:'s6h' };
  Object.keys(map).forEach(function(id){
    var el = document.getElementById(id);
    if(el && d[map[id]]) el.innerHTML = d[map[id]];
  });
  // form result
  var ft = document.getElementById('fres-t');
  var fb = document.getElementById('fres-b');
  if(ft) ft.textContent = d.resultTitle;
  if(fb) fb.textContent = d.resultText;
  // theme button
  var tbtn = document.getElementById('tbtn');
  if(tbtn) tbtn.textContent = theme==='dark' ? d.themeNight : d.themeDay;
  // lang button
  document.getElementById('lbtn').textContent = lang==='ru' ? 'EN' : 'RU';
  // scroll hint (text node inside is set by this, but the element was typed, use dataset)
  var sh = document.getElementById('scroll-hint');
  if(sh) sh.textContent = d.scrollHint;
}

/* ═════════════════════════════════════════
   SCENE SYSTEM
═════════════════════════════════════════ */
var cur=0, LAST=8, userName='', lang='ru', theme='dark', busy=false;

function type(el,text,speed,delay){
  return new Promise(function(res){
    setTimeout(function(){
      var i=0;
      el.innerHTML='<span class="caret"></span>';
      var iv=setInterval(function(){
        if(i>=text.length){clearInterval(iv);res();return;}
        el.innerHTML=text.slice(0,++i)+'<span class="caret"></span>';
      },speed||38);
    },delay||0);
  });
}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);})}

var strips=[0,1,2,3,4,5].map(function(i){return document.getElementById('ws'+i);});
function wipeIn(){
  return new Promise(function(res){
    strips.forEach(function(s){s.style.transition='none';s.style.transform='scaleX(0)';s.style.transformOrigin='left center';});
    requestAnimationFrame(function(){
      strips.forEach(function(s,i){
        s.style.transition='transform .30s cubic-bezier(.76,0,.24,1) '+(i*26)+'ms';
        s.style.transform='scaleX(1)';
      });
      setTimeout(res, 300+strips.length*26+40);
    });
  });
}
function wipeOut(){
  return new Promise(function(res){
    strips.forEach(function(s,i){
      s.style.transformOrigin='right center';
      s.style.transition='transform .28s cubic-bezier(.76,0,.24,1) '+(i*20)+'ms';
      s.style.transform='scaleX(0)';
    });
    setTimeout(res, 280+strips.length*20+30);
  });
}

window.nav=async function(target){
  target=Math.max(0,Math.min(LAST,+target));
  if(target===cur||busy)return;
  if(cur===0&&target>0&&!userName.trim()){
    var nr=document.getElementById('name-row');
    nr.classList.add('err');
    document.getElementById('name-in').focus();
    setTimeout(function(){nr.classList.remove('err');},420);
    return;
  }
  busy=true;
  await wipeIn();
  document.getElementById('s'+cur).classList.remove('active');
  cur=target;
  document.getElementById('s'+cur).classList.add('active');
  updateUI();
  var el=document.getElementById('bt'+cur);
  if([1,3,5,7].includes(cur)&&el){
    var txt=T[lang].bridges[cur];
    type(el,txt,44,180);
    setTimeout(function(){if(cur===target)nav(cur+1);},Math.max(3200,1100+txt.length*36));
  }
  if(cur===8)setTimeout(function(){document.getElementById('cform').classList.add('on');},600);
  await wipeOut();
  busy=false;
};

function updateUI(){
  document.getElementById('prog-bar').style.width=(cur/LAST*100)+'%';
  document.getElementById('ctr').textContent=String(cur+1).padStart(2,'0')+' / '+String(LAST+1).padStart(2,'0');
  document.getElementById('b-prev').disabled=cur===0;
  document.getElementById('b-next').disabled=cur===LAST;
  var map={0:0,1:0,2:1,3:1,4:2,5:2,6:3,7:3,8:4};
  document.querySelectorAll('.nav-rail button').forEach(function(b,i){b.classList.toggle('on',i===map[cur]);});
}

window.addEventListener('DOMContentLoaded',async function(){
  applyLang();
  await type(document.getElementById('t-hello'), T[lang].hello, 65, 380);
  await sleep(400);
  await type(document.getElementById('t-welcome'), T[lang].welcome, 32);
  await sleep(1100);
  var pg=document.getElementById('ph-greet');
  var pn=document.getElementById('ph-name');
  pg.classList.add('fade-out');
  await sleep(460);
  pg.style.display='none';
  pn.style.opacity='0';pn.style.transform='translateY(20px)';pn.style.pointerEvents='all';
  pn.style.transition='opacity .6s,transform .6s';
  requestAnimationFrame(function(){requestAnimationFrame(function(){pn.style.opacity='1';pn.style.transform='translateY(0)';});});
  await sleep(300);
  await type(document.getElementById('t-question'), T[lang].question, 32, 180);
  document.getElementById('scroll-hint').classList.add('on');
});

window.start=function(){
  var v=document.getElementById('name-in').value.trim();
  if(!v){var nr=document.getElementById('name-row');nr.classList.add('err');setTimeout(function(){nr.classList.remove('err');},420);return;}
  userName=v;
  try{
    var ctx=new(window.AudioContext||window.webkitAudioContext)();
    var g=ctx.createGain();g.gain.setValueAtTime(.0001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.038,ctx.currentTime+.03);
    g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.5);g.connect(ctx.destination);
    [110,165,247].forEach(function(f,i){var o=ctx.createOscillator();o.type=i===0?'sine':'triangle';
      o.frequency.value=f;o.frequency.exponentialRampToValueAtTime(f*1.4,ctx.currentTime+.35);
      o.connect(g);o.start(ctx.currentTime+i*.033);o.stop(ctx.currentTime+.55);});
  }catch(e){}
  nav(1);
};

window.selCase=function(el){document.querySelectorAll('.c-card').forEach(function(c){c.classList.remove('sel');});el.classList.add('sel');};
window.submitF=function(){document.getElementById('fres').classList.add('on');};

window.toggleTheme=function(){
  theme=theme==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',theme);
  if(window._setDark)window._setDark(theme==='dark');
  document.getElementById('tbtn').textContent=theme==='dark'?T[lang].themeNight:T[lang].themeDay;
};

window.toggleLang=function(){
  lang=lang==='ru'?'en':'ru';
  applyLang();
  // Re-type intro if on scene 0
  if(cur===0){
    var tq=document.getElementById('t-question');
    if(tq&&tq.textContent)type(tq,T[lang].question,32,0);
  }
  // Re-type bridge if on bridge scene
  if([1,3,5,7].includes(cur)){
    var be=document.getElementById('bt'+cur);
    if(be)type(be,T[lang].bridges[cur],44,0);
  }
};

var wlk=false;
window.addEventListener('wheel',function(e){
  var t=e.target&&e.target.tagName.toLowerCase();
  if(t==='input'||t==='textarea')return;
  if(Math.abs(e.deltaY)<18)return;
  e.preventDefault();
  if(wlk||busy)return;
  wlk=true;nav(cur+(e.deltaY>0?1:-1));
  setTimeout(function(){wlk=false;},820);
},{passive:false});

window.addEventListener('keydown',function(e){
  if(e.key==='ArrowDown'||e.key==='PageDown')nav(cur+1);
  if(e.key==='ArrowUp'||e.key==='PageUp')nav(cur-1);
  if(e.key==='Enter'&&cur===0)start();
});

var ty0=0;
window.addEventListener('touchstart',function(e){ty0=e.touches[0].clientY;},{passive:true});
window.addEventListener('touchend',function(e){var d=ty0-e.changedTouches[0].clientY;if(Math.abs(d)>40)nav(cur+(d>0?1:-1));},{passive:true});
document.getElementById('name-in').addEventListener('keydown',function(e){if(e.key==='Enter')start();});

// init theme button
window.addEventListener('DOMContentLoaded',function(){
  document.getElementById('tbtn').textContent=T[lang].themeNight;
});
</script>
